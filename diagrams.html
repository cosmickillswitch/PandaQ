<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F6B40">
<meta name="description" content="Propositional logic: build arguments, check them with truth tables, step through Fitch proofs, and learn the terms.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>PandQ · Diagrams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<link rel="stylesheet" href="workbench.css">
<link rel="stylesheet" href="diagrams.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="wrap">
  <header class="brand">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect x="0" y="0" width="200" height="200" rx="44" fill="#3F7D4E"/>
<circle cx="56" cy="60" r="25" fill="#1D1D1B"/><circle cx="144" cy="60" r="25" fill="#1D1D1B"/>
<ellipse cx="100" cy="112" rx="72" ry="63" fill="#FBFAF6"/>
<ellipse cx="71" cy="104" rx="20" ry="26" fill="#1D1D1B" transform="rotate(-24 71 104)"/>
<ellipse cx="129" cy="104" rx="20" ry="26" fill="#1D1D1B" transform="rotate(24 129 104)"/>
<text x="72" y="114" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#FBFAF6">P</text>
<text x="128" y="114" text-anchor="middle" font-family="DM Sans, Arial, sans-serif" font-weight="700" font-size="28" fill="#FBFAF6">Q</text>
<path d="M87 152 L100 133 L113 152" fill="none" stroke="#1D1D1B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div><h1>PandQ<span class="testflag">Test</span></h1><p>Propositional logic: build, prove, learn.</p></div>
  </header>
  <nav class="appnav" aria-label="Sections"><a href="index.html">Build</a><a href="prove.html">Prove</a><a href="diagrams.html" aria-current="page">Diagrams</a><a href="learn.html">Learn</a></nav>
  <section class="card" aria-label="Formula">
    <label class="dlabel" for="fin">Formula</label>
    <input id="fin" class="fin" autocomplete="off" autocapitalize="characters" spellcheck="false">
    <div class="dkeys" id="dkeys"><button data-k="P">P</button><button data-k="Q">Q</button><button data-k="R">R</button><button data-k="S">S</button><button data-k="¬">¬</button><button data-k="∧">∧</button><button data-k="∨">∨</button><button data-k="→">→</button><button data-k="↔">↔</button><button data-k="(">(</button><button data-k=")">)</button></div>
    <p class="ferr" id="ferr" role="alert"></p>
    <div class="dex" id="dex"><button data-f="P → Q">P → Q</button><button data-f="P ∧ Q">P ∧ Q</button><button data-f="P ∨ Q">P ∨ Q</button><button data-f="P ↔ Q">P ↔ Q</button><button data-f="¬(P ↔ Q)">¬(P ↔ Q)</button><button data-f="(P ∧ R) → (P ∨ Q)">(P ∧ R) → (P ∨ Q)</button><button data-f="(P → Q) ∧ (Q → R)">(P → Q) ∧ (Q → R)</button><button data-f="P ∨ ¬P">P ∨ ¬P</button></div>
  </section>
  <nav class="dtabs" id="dtabs" role="tablist" aria-label="Diagram">
    <button role="tab" data-v="hasse">Hasse</button><button role="tab" data-v="table">Truth table</button><button role="tab" data-v="venn">Venn</button><button role="tab" data-v="robdd">ROBDD</button>
    <button role="tab" data-v="frege">Frege</button><button role="tab" data-v="peirce">Peirce</button><button role="tab" data-v="tractatus">Tractatus</button><button role="tab" data-v="truthdiagram">Truth diagram</button>
  </nav>
  <p class="fshow">Showing <span id="fshow"></span></p>
  <section class="card dview" id="view" aria-live="polite"></section>
</div>
<script src="fitch-core.js"></script>
<script src="diagrams.js"></script>
<script>if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>

</html>
